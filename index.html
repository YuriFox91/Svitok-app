<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свиток</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-table: #1a120c; 
            --parchment-bg: #f4e8d2; 
            --ink-color: #3b2716; 
            --ink-light: #6e4e32;
            --accent: #8c2626; 
            --wood-dark: #3a200d;
            --wood-light: #7a4d2c;
        }
        
        [data-theme="dark"] {
            --bg-table: #080503;
            --parchment-bg: #2b2013; 
            --ink-color: #d4c0a5; 
            --ink-light: #a38c73;
            --accent: #a33b3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: color 0.4s ease, background-color 0.4s ease, box-shadow 0.4s ease;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: var(--bg-table);
            color: var(--ink-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: hidden; 
        }

        /* ЗАСТАВКА */
        #splash-screen {
            position: fixed;
            inset: 0;
            background-color: #080503;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease;
        }

        .splash-light-beam {
            position: absolute;
            top: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 120vh;
            background: linear-gradient(to bottom, transparent, #ffeaa7, #ffffff, transparent);
            box-shadow: 0 0 30px 10px #ffeaa7, 0 0 80px 30px #f5cd79;
            animation: beamDescend 3s ease-out forwards;
            z-index: 1;
        }

        .splash-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 5rem;
            font-weight: 700;
            color: transparent;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #ffffff, #f5cd79);
            -webkit-background-clip: text;
            background-clip: text;
            animation: titleReveal 3.5s ease-out 1s forwards;
            z-index: 2;
        }

        @keyframes beamDescend {
            0% { top: -150%; opacity: 0; }
            40% { opacity: 1; width: 4px; box-shadow: 0 0 50px 20px #ffeaa7, 0 0 100px 40px #f5cd79; }
            100% { top: 100%; opacity: 0; width: 1px; }
        }

        @keyframes titleReveal {
            0% { color: transparent; text-shadow: 0 0 0px rgba(255,234,167,0); transform: scale(0.9); opacity: 0; }
            30% { opacity: 1; }
            50% { color: #ffffff; text-shadow: 0 0 40px rgba(255,234,167,0.8); transform: scale(1.05); }
            100% { color: #f5cd79; text-shadow: 0 0 15px rgba(255,234,167,0.4); transform: scale(1); opacity: 1; }
        }

        @media (max-width: 650px) {
            .splash-title { font-size: 3.5rem; }
        }

        /* ИНТЕРФЕЙС СВИТКА */
        .roller {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 960px;
            height: 40px;
            z-index: 100;
            display: flex;
            align-items: center;
        }
        .roller.top { top: 0; }
        .roller.bottom { bottom: 0; }

        .roller-cap {
            width: 30px;
            height: 50px;
            background: linear-gradient(to bottom, #2b1608, #5c351a, #1a0d05);
            border-radius: 6px;
            box-shadow: inset 0 0 8px #000, 0 5px 10px rgba(0,0,0,0.8);
            z-index: 101;
        }
        
        .roller-cylinder {
            flex: 1;
            height: 34px;
            background-image: 
                linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(255,255,255,0.15) 30%, rgba(0,0,0,0.8) 100%),
                repeating-linear-gradient(to bottom, var(--wood-dark) 0px, var(--wood-light) 6px, var(--wood-dark) 12px);
            background-size: 100% 100%, 100% 100%;
            box-shadow: 0 15px 25px rgba(0,0,0,0.9);
            margin: 0 -5px; 
            position: relative;
            z-index: 100;
        }

        .scroll-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 20px 0; 
            padding: 40px 50px;
            min-height: 100vh;
            background-color: var(--parchment-bg);
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.05' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            box-shadow: inset 0 0 60px rgba(100,50,0,0.4), 0 0 30px rgba(0,0,0,0.9);
            position: relative;
            z-index: 10;
        }

        [data-theme="dark"] .scroll-wrapper {
            box-shadow: inset 0 0 80px rgba(0,0,0,0.95), 0 0 30px rgba(0,0,0,0.9);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--ink-light);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .icon-btn {
            background: transparent;
            border: 2px solid var(--ink-light);
            color: var(--ink-color);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: none;
            border: none;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--ink-light);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .tab-btn.active {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-color: var(--accent);
            text-decoration-thickness: 2px;
            text-underline-offset: 6px;
        }

        .section { display: none; animation: fadeIn 0.5s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .date-badge {
            font-style: italic;
            font-size: 1.2rem;
            color: var(--ink-light);
            margin-bottom: 1rem;
            text-align: center;
            border-bottom: 1px dashed var(--ink-light);
            display: inline-block;
            padding-bottom: 0.3rem;
            width: 100%;
        }

        .verse-card { text-align: center; margin-bottom: 3rem; }

        .verse-text {
            font-size: 2.4rem;
            font-style: italic;
            line-height: 1.3;
            margin-bottom: 1.5rem;
            padding: 0 20px;
        }

        .verse-ref {
            font-weight: 700;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .sermon-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .sermon-content p {
            margin-bottom: 1.5rem;
            font-size: 1.35rem;
            line-height: 1.7;
            text-align: justify;
            text-indent: 2rem;
        }

        .author-sign {
            margin-top: 2rem;
            font-weight: 700;
            font-size: 1.25rem;
            text-align: right;
            color: var(--accent);
            font-style: italic;
        }

        .prayer-box {
            background-color: transparent;
            border: 2px solid var(--accent);
            padding: 2.5rem 2rem 2rem 2rem;
            margin-top: 3rem;
            font-style: italic;
            font-size: 1.35rem;
            text-align: center;
            position: relative;
        }
        
        .prayer-box::before {
            content: '✝';
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--parchment-bg);
            padding: 0 15px;
            color: var(--accent);
            font-size: 1.8rem;
        }

        /* Дневник */
        .search-input {
            width: 100%;
            padding: 0.5rem 0;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--ink-light);
            color: var(--ink-color);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            outline: none;
        }

        .note-input {
            width: 100%;
            padding: 0.5rem 0;
            background: transparent;
            border: none;
            border-bottom: 2px dashed var(--ink-light);
            color: var(--ink-color);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            outline: none;
        }

        .note-textarea {
            width: 100%;
            min-height: 200px;
            background: transparent;
            border: none;
            color: var(--ink-color);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            line-height: 32px;
            outline: none;
            resize: vertical;
            background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(110, 78, 50, 0.2) 31px, rgba(110, 78, 50, 0.2) 32px);
        }

        .note-editor {
            display: none;
            margin-top: 2rem;
            border: 1px solid var(--ink-light);
            padding: 2rem;
        }
        .note-editor.active { display: block; }

        .note-item {
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--ink-light);
            position: relative;
        }

        .note-item h4 { font-size: 1.6rem; margin-bottom: 0.5rem; color: var(--accent); }
        .note-date { font-size: 1rem; font-style: italic; color: var(--ink-light); margin-bottom: 1rem; }

        .delete-note {
            position: absolute;
            top: 0;
            right: 0;
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 1.1rem;
            font-family: 'Cormorant Garamond', serif;
            text-decoration: underline;
        }

        button.action-btn {
            background-color: transparent;
            color: var(--ink-color);
            border: 2px solid var(--ink-color);
            padding: 0.6rem 1.5rem;
            font-size: 1.2rem;
            font-family: 'Cormorant Garamond', serif;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--ink-color);
            color: var(--parchment-bg);
        }

        footer {
            text-align: center;
            padding-top: 2rem;
            margin-top: 3rem;
            border-top: 1px solid var(--ink-light);
            font-style: italic;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        @media (max-width: 650px) {
            .scroll-wrapper { padding: 30px 20px; }
            .verse-text { font-size: 1.8rem; padding: 0; }
            .sermon-title { font-size: 2rem; }
            .nav-tabs { gap: 1rem; }
            .tab-btn { font-size: 1.1rem; }
            .prayer-box { padding: 2rem 1.5rem 1.5rem; }
        }
    </style>
</head>
<body data-theme="light">

<!-- ЗАСТАВКА -->
<div id="splash-screen">
    <div class="splash-light-beam"></div>
    <div class="splash-title">Свиток</div>
</div>

<!-- ВЕРХНИЙ ВАЛИК СВИТКА -->
<div class="roller top">
    <div class="roller-cap left"></div>
    <div class="roller-cylinder" id="cylinder-top"></div>
    <div class="roller-cap right"></div>
</div>

<!-- НИЖНИЙ ВАЛИК СВИТКА -->
<div class="roller bottom">
    <div class="roller-cap left"></div>
    <div class="roller-cylinder" id="cylinder-bottom"></div>
    <div class="roller-cap right"></div>
</div>

<!-- ОСНОВНОЙ ПЕРГАМЕНТ -->
<div class="scroll-wrapper">
    <header>
        <div class="logo">Свиток</div>
        <button class="icon-btn" id="theme-toggle-btn" title="Ночной свиток">🌙</button>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('daily')">Стих и размышление</button>
        <button class="tab-btn" onclick="switchTab('notebook')">Летопись души</button>
    </div>

    <main>
        <section id="daily" class="section active">
            <div class="verse-card">
                <div class="date-badge" id="current-date">Загрузка...</div>
                <div class="verse-text" id="daily-verse-text">Разворачиваем свиток...</div>
                <div class="verse-ref" id="daily-verse-ref"></div>
                <div style="margin-top: 2.5rem;">
                    <button class="action-btn" onclick="generateNewDaily()">Развернуть новый стих</button>
                </div>
            </div>

            <div>
                <h1 class="sermon-title" id="sermon-title">Слово на сегодня</h1>
                <div class="sermon-content" id="sermon-body"></div>
            </div>
        </section>

        <section id="notebook" class="section">
            <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 2rem;">
                <h2 style="font-size: 2.2rem; text-transform: uppercase;">Летопись души</h2>
                <button class="action-btn" onclick="toggleNoteEditor()">Взять перо</button>
            </div>
            
            <input type="text" id="search-input" class="search-input" placeholder="Поиск по записям..." oninput="filterNotes()">
            
            <div id="note-editor" class="note-editor">
                <input type="text" id="note-title" class="note-input" placeholder="Заголовок (например: Благодарности...)">
                <textarea id="note-text" class="note-textarea" placeholder="Начните писать здесь..."></textarea>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button class="action-btn" onclick="saveNote()">Запечатлеть</button>
                    <button class="action-btn" style="border-color: var(--ink-light); color: var(--ink-light);" onclick="toggleNoteEditor()">Отложить</button>
                </div>
            </div>

            <div id="notes-list" style="margin-top: 3rem;"></div>
        </section>
    </main>

    <footer>
        Приложение «Свиток» • Разработано by Yuri Lisovsky
    </footer>
</div>

<script>
    // ОРИГИНАЛЬНЫЕ ЦИТАТЫ И РАЗМЫШЛЕНИЯ ИЗВЕСТНЫХ БОГОСЛОВОВ И ПРОПОВЕДНИКОВ
    const DAILY_DATABASE = [
        {
            ref: "К Филиппийцам 4:13",
            verse: "Все могу в укрепляющем меня Христе Иисусе.",
            title: "Вседостаточность Христа",
            content: `
                <p>Тайная жизнь верующего держится на невидимом союзе со Спасителем. Когда апостол Павел говорит: «Все могу в укрепляющем меня Христе», он не хвалится своей выносливостью или духовной закалкой. Он указывает на внешний, неиссякаемый источник. Христианин подобен тростнику на ветру: сам по себе он слаб и падает от малейшего шторма, но будучи соединен с живым Корнем, он устоит перед лицом любых испытаний.</p>
                <p>В самих себе мы не имеем ресурса для победы над грехом, страхом или унынием. Но во Христе нам дарована полнота. Как нищий, получивший неограниченный доступ к царской сокровищнице, верующий черпает силу не из собственных заслуг, а из совершенной жертвы и благодати Господа Иисуса.</p>
                <div class="author-sign">Чарльз Сперджен, из сборника утренних размышлений «Утром и вечером»</div>
                <div class="prayer-box">Господь Иисус, я исповедую свою слабость и немощь. Научи меня черпать победу и крепость не из собственных усилий, а из Твоего непререкаемого источника. Аминь.</div>
            `
        },
        {
            ref: "Притчи Соломона 3:5",
            verse: "Надейся на Господа всем сердцем твоим, и не полагайся на разум твой.",
            title: "Укрощение человеческого разума",
            content: `
                <p>Вера начинается там, где заканчивается человеческий расчет. Наш разум — это прекрасный дар Творца для управления земными делами, но он совершенно слеп, когда дело касается путей провидения и нашего духовного будущего. Разум шепчет нам о тупиках и рисках, в то время как истинная вера смотрит на пронзенные руки Христа и знает, что для Него нет безвыходных ситуаций.</p>
                <p>Полагаться на Господа всем сердцем означает перестать спорить с Его волей и вырывать карту из Его отцовских рук. Доверие означает принимать Божье сердце даже тогда, когда мы абсолютно не понимаем Его руку. Тот, кто отдал за нас Свою жизнь на Голгофе, не способен ошибиться в деталях нашей повседневной дороги.</p>
                <div class="author-sign">Томас Уотсон, из книги «Божественное содержание»</div>
                <div class="prayer-box">Господь Иисус, прости мне мои постоянные сомнения и попытки просчитать всё собственным умом. Я предаю свое завтра в Твое любящее сердце. Аминь.</div>
            `
        },
        {
            ref: "Псалтирь 22:1",
            verse: "Господь — Пастырь мой; я ни в чем не буду нуждаться.",
            title: "Забота Доброго Пастыря",
            content: `
                <p>Овца не заботится о том, где она будет искать воду завтра или как защититься от хищников — это полная ответственность пастыря. Наша главная беда заключается в том, что мы пытаемся одновременно играть роль беспомощной овцы и роль всезнающего пастыря своей жизни, от чего и сходим с ума от тревог.</p>
                <p>Иисус Христос — Добрый Пастырь, отдал жизнь за Свое стадо. Если Он заплатил за нас такую искупительную цену, неужели Он оставит нас без хлеба, утешения или водительства сегодня? Его пажить изобильна, а защита абсолютна. Снимите с себя бремя пастуха своей жизни и доверьтесь Его посоху.</p>
                <div class="author-sign">Джордж Мюллер, из духовных дневников «Жизнь веры»</div>
                <div class="prayer-box">Господь Иисус, Ты — мой Пастырь. Избавь меня от страха нужды и научи смирно идти за Твоим голосом, находя покой в Твоей заботе. Аминь.</div>
            `
        },
        {
            ref: "Иеремия 29:11",
            verse: "Ибо только Я знаю намерения, какие имею о вас, говорит Господь, намерения во благо, а не на зло...",
            title: "Защищенные суверенной любовью",
            content: `
                <p>Нас формирует не то, что происходит с нами в часы радости, а то, к чему мы обращаемся в минуты глубочайшего кризиса. Когда привычные опоры рушатся, человеческому сердцу свойственно думать, что Бог оставил его или держит на него гнев. Но Евангелие открывает нам совершенно иную истину: наш Небесный Отец смотрит на нас исключительно через призму совершенного искупления Своего Сына.</p>
                <p>Намерения Иисуса Христа о нас не меняются от штормов. Все трудности, через которые Он нас проводит, служат одной благородной цели — сделать нас причастниками Его святости. То, что кажется нам крушением планов, в Его мастерской является процессом огранки драгоценного камня.</p>
                <div class="author-sign">А. В. Тозер, из книги «Корни праведности»</div>
                <div class="prayer-box">Господь Иисус, я верю, что Твои планы о моей жизни наполнены благостью. Помоги мне доверять Твоему премудрому переплавляющему огню. Аминь.</div>
            `
        },
        {
            ref: "От Матфея 11:28",
            verse: "Придите ко Мне, все труждающиеся и обремененные, и Я успокою вас.",
            title: "Прибежище для изнуренной души",
            content: `
                <p>Верующему полезно чаще размышлять о том, что Христос не просто ожидает нас на небесах — Он уже сейчас предлагает Свой глубокий покой нашим изнуренным душам. Мы часто носим на себе тяжелый груз вины, обид, самоедства и стремления всем угодить, хотя Спаситель давно прибил этот греховный багаж к Голгофскому древу.</p>

    // УПРАВЛЕНИЕ ЗАСТАВКОЙ И ТЕМОЙ
    let currentTheme = 'light';
    let memoryNotes = [];

    function safeGetItem(key, defaultVal) {
        try { return localStorage.getItem(key) || defaultVal; } 
        catch (e) { return defaultVal; }
    }

    function safeSetItem(key, val) {
        try { localStorage.setItem(key, val); } 
        catch (e) {}
    }

    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if(splash) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.body.style.overflowY = 'auto';
                }, 1500);
            }
        }, 4000); 
    });

    window.addEventListener('scroll', () => {
        const y = window.scrollY;
        const topCyl = document.getElementById('cylinder-top');
        const botCyl = document.getElementById('cylinder-bottom');
        if(topCyl) topCyl.style.backgroundPosition = `0 0, 0 ${y * 0.4}px`;
        if(botCyl) botCyl.style.backgroundPosition = `0 0, 0 ${-y * 0.4}px`;
    });

    function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(currentTheme);
        safeSetItem('app_theme', currentTheme);
    }

    window.addEventListener('DOMContentLoaded', () => {
        currentTheme = safeGetItem('app_theme', 'light');
        applyTheme(currentTheme);

        const themeBtn = document.getElementById('theme-toggle-btn');
        if(themeBtn) {
            themeBtn.addEventListener('click', toggleTheme);
            themeBtn.removeAttribute('onclick');
        }

        try {
            const savedNotes = localStorage.getItem('spiritual_notes');
            if(savedNotes) memoryNotes = JSON.parse(savedNotes);
        } catch(e) {}

        setDateBadge();
        loadDailyContent();
        loadNotes();
    });

    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function setDateBadge() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = now.toLocaleDateString('ru-RU', options);
    }

    function loadDailyContent(customIndex = null) {
        const now = new Date();
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        const index = customIndex !== null ? customIndex : (dayOfYear % DAILY_DATABASE.length);
        const data = DAILY_DATABASE[index];
        
        document.getElementById('daily-verse-ref').textContent = data.ref;
        document.getElementById('daily-verse-text').textContent = `«${data.verse}»`;
        document.getElementById('sermon-title').textContent = data.title;
        document.getElementById('sermon-body').innerHTML = data.content;
    }

    function generateNewDaily() {
        loadDailyContent(Math.floor(Math.random() * DAILY_DATABASE.length));
    }

    function toggleNoteEditor() {
        const editor = document.getElementById('note-editor');
        editor.classList.toggle('active');
        if (editor.classList.contains('active')) document.getElementById('note-title').focus();
    }

    function saveNote() {
        const title = document.getElementById('note-title').value.trim();
        const text = document.getElementById('note-text').value.trim();
        if (!title || !text) { alert('Летопись не терпит пустоты. Укажите заголовок и мысль.'); return; }

        const newNote = { 
            id: Date.now(), 
            title, 
            text, 
            date: new Date().toLocaleDateString('ru-RU', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) 
        };
        
        memoryNotes.unshift(newNote);
        safeSetItem('spiritual_notes', JSON.stringify(memoryNotes));

        document.getElementById('note-title').value = '';
        document.getElementById('note-text').value = '';
        document.getElementById('note-editor').classList.remove('active');
        loadNotes();
    }

    function loadNotes() {
        if (memoryNotes.length === 0) {
            document.getElementById('notes-list').innerHTML = `<p style="color: var(--ink-light); font-style: italic; text-align: center; padding: 2rem; font-size: 1.2rem;">Страницы вашей летописи пока пусты.</p>`;
            return;
        }
        renderNotes(memoryNotes);
    }

    function filterNotes() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = memoryNotes.filter(n => n.title.toLowerCase().includes(query) || n.text.toLowerCase().includes(query));
        renderNotes(filtered);
    }

    function deleteNote(id) {
        memoryNotes = memoryNotes.filter(n => n.id !== id);
        safeSetItem('spiritual_notes', JSON.stringify(memoryNotes));
        loadNotes();
    }

    function renderNotes(notesArray) {
        document.getElementById('notes-list').innerHTML = notesArray.map(n => `
            <div class="note-item">
                <button class="delete-note" onclick="deleteNote(${n.id})">Стереть</button>
                <h4>${n.title.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m])}</h4>
                <div class="note-date">${n.date}</div>
                <p style="white-space: pre-line; font-size: 1.2rem;">${n.text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m])}</p>
            </div>
        `).join('');
    }
</script>
